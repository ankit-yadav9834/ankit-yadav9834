# Generates the contribution-snake animation used at the bottom of the profile README.
#
# WHERE THIS GOES: in the NEW profile repository only —
#   ankit-yadav9834/ankit-yadav9834/.github/workflows/snake.yml
# It touches no other repository.
#
# It writes two SVGs to an orphan branch called `output`, which the README then
# reads over raw.githubusercontent.com. Nothing is committed to `main`.

name: Generate snake animation

on:
  schedule:
    # Every six hours, so the snake stays roughly in step with the graph.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Render the contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
